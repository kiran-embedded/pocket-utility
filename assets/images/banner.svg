<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%">
  <defs>
    <style>
      .bg { fill: transparent; }
      .text-title {
        font-family: 'Courier New', Courier, monospace;
        font-size: 56px;
        font-weight: bold;
        fill: #b594fa;
        stroke: #b594fa;
        stroke-width: 1.5px;
        stroke-dasharray: 500;
        stroke-dashoffset: 500;
        animation: draw 2s ease forwards, glow 3s ease-in-out infinite alternate 2s;
      }
      .text-sub {
        font-family: 'Courier New', Courier, monospace;
        font-size: 18px;
        fill: #9a7cdc;
        opacity: 0;
        animation: fadeIn 1s ease forwards 1.5s;
      }
      .shape {
        fill: none;
        stroke: #c8b3fb;
        stroke-width: 2;
        opacity: 0.4;
      }
      .pulse-ring {
        fill: none;
        stroke: #b594fa;
        stroke-width: 2;
        opacity: 0;
        animation: pulse 3s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes glow { from { text-shadow: 0 0 10px #b594fa33; } to { text-shadow: 0 0 20px #b594fa88; } }
      @keyframes fadeIn { to { opacity: 0.9; } }
      @keyframes pulse { 0% { r: 10px; opacity: 0.8; } 100% { r: 60px; opacity: 0; } }
    </style>
  </defs>

  <rect width="800" height="250" class="bg"/>

  <g transform="translate(100, 80)">
    <polygon points="25,0 50,50 0,50" class="shape">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-15; 0,0" dur="6s" repeatCount="indefinite" />
    </polygon>
  </g>
  <g transform="translate(680, 50)">
    <circle cx="20" cy="20" r="20" class="shape">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,15; 0,0" dur="8s" repeatCount="indefinite" />
    </circle>
  </g>
  <g transform="translate(700, 160)">
    <rect width="30" height="30" rx="5" class="shape">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-10; 0,0" dur="7s" repeatCount="indefinite" />
    </rect>
  </g>

  <circle cx="125" cy="110" class="pulse-ring" style="animation-delay: 0s"/>
  <circle cx="125" cy="110" class="pulse-ring" style="animation-delay: 1.5s"/>

  <text x="400" y="130" class="text-title" text-anchor="middle">Pocket Utility</text>
  <text x="400" y="170" class="text-sub" text-anchor="middle">&lt; 40+ everyday tools in one lightweight app /&gt;</text>
</svg>
